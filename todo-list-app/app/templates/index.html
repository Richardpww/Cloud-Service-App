
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container py-5">
        <header class="mb-4">
            <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
            <h1>TaskFlow<span>.</span></h1>
            <p class="text-secondary">Keep your tasks organized and stay productive.</p>
        </header>

        <section class="card task-form mb-4">
            <div class="card-body p-4">
                <h2 class="h5 mb-3">Add a new task</h2>
                <form id="task-form">
                    <div class="mb-3">
                        <label for="title" class="form-label">Task title</label>
                        <input id="title" class="form-control" maxlength="120"
                               placeholder="What do you need to do?" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description (optional)</label>
                        <textarea id="description" class="form-control" maxlength="500"
                                  rows="2" placeholder="Add some details..."></textarea>
                    </div>
                    <button class="btn btn-primary" type="submit">+ Add Task</button>
                </form>
                <div id="message" class="mt-3" role="status" aria-live="polite"></div>
            </div>
        </section>

        <section>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">My Tasks</h2>
                <span id="task-count" class="badge text-bg-light">0 tasks</span>
            </div>
            <div id="task-list" class="d-grid gap-3">
                <p class="text-secondary">Loading tasks...</p>
            </div>
        </section>

        <footer class="text-center text-secondary mt-5 small">
            TaskFlow · Powered by Flask, PostgreSQL & Docker
        </footer>
    </main>

    <script>
        const form = document.getElementById("task-form");
        const titleInput = document.getElementById("title");
        const descriptionInput = document.getElementById("description");
        const taskList = document.getElementById("task-list");
        const message = document.getElementById("message");
        const taskCount = document.getElementById("task-count");

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = isError
                ? "mt-3 text-danger small"
                : "mt-3 text-success small";
        }

        async function api(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...options.headers
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Something went wrong");
            }

            return data;
        }

        async function loadTasks() {
            try {
                const tasks = await api("/api/tasks");
                taskList.replaceChildren();

                const completed = tasks.filter(task => task.completed).length;
                taskCount.textContent = `${completed}/${tasks.length} completed`;

                if (tasks.length === 0) {
                    const empty = document.createElement("p");
                    empty.className = "empty-state";
                    empty.textContent = "No tasks yet. Add your first task above!";
                    taskList.appendChild(empty);
                    return;
                }

                tasks.forEach(task => {
                    const card = document.createElement("article");
                    card.className = `card task-card${task.completed ? " completed" : ""}`;

                    const body = document.createElement("div");
                    body.className = "card-body d-flex align-items-start gap-3";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "form-check-input mt-1";
                    checkbox.checked = task.completed;
                    checkbox.setAttribute("aria-label", "Mark task complete");
                    checkbox.addEventListener("change", async () => {
                        try {
                            await api(`/api/tasks/${task.id}`, {
                                method: "PUT",
                                body: JSON.stringify({ completed: checkbox.checked })
                            });
                            await loadTasks();
                        } catch (error) {
                            showMessage(error.message, true);
                        }
                    });

                    const content = document.createElement("div");
                    content.className = "flex-grow-1";

                    const heading = document.createElement("h3");
                    heading.className = "h6 task-title";
                    heading.textContent = task.title;

                    const description = document.createElement("p");
                    description.className = "text-secondary small mb-0";
                    description.textContent = task.description || "No description";

                    content.append(heading, description);

                    const actions = document.createElement("div");
                    actions.className = "d-flex gap-2";

                    const editButton = document.createElement("button");
                    editButton.className = "btn btn-sm btn-outline-secondary";
                    editButton.textContent = "Edit";
                    editButton.addEventListener("click", async () => {
                        const newTitle = prompt("Edit task title:", task.title);
                        if (newTitle === null) return;

                        const newDescription = prompt(
                            "Edit description:", task.description
                        );
                        if (newDescription === null) return;

                        try {
                            await api(`/api/tasks/${task.id}`, {
                                method: "PUT",
                                body: JSON.stringify({
                                    title: newTitle,
                                    description: newDescription
                                })
                            });
                            showMessage("Task updated successfully.");
                            await loadTasks();
                        } catch (error) {
                            showMessage(error.message, true);
                        }
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.className = "btn btn-sm btn-outline-danger";
                    deleteButton.textContent = "Delete";
                    deleteButton.addEventListener("click", async () => {
                        if (!confirm(`Delete "${task.title}"?`)) return;

                        try {
                            await api(`/api/tasks/${task.id}`, {
                                method: "DELETE"
                            });
                            showMessage("Task deleted successfully.");
                            await loadTasks();
                        } catch (error) {
                            showMessage(error.message, true);
                        }
                    });

                    actions.append(editButton, deleteButton);
                    body.append(checkbox, content, actions);
                    card.appendChild(body);
                    taskList.appendChild(card);
                });
            } catch (error) {
                taskList.textContent = "Unable to load tasks. Please try again.";
                showMessage(error.message, true);
            }
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            try {
                await api("/api/tasks", {
                    method: "POST",
                    body: JSON.stringify({
                        title: titleInput.value,
                        description: descriptionInput.value
                    })
                });

                form.reset();
                showMessage("Task added successfully.");
                await loadTasks();
            } catch (error) {
                showMessage(error.message, true);
            }
        });

        loadTasks();
    </script>
</body>
</html>
